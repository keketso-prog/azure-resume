name: Deploy Resume

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload index.html
        run: |
          az storage blob upload \
            --account-name keketsoresume \
            --container-name '$web' \
            --file index.html \
            --name index.html \
            --overwrite true
