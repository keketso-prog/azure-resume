name: Deploy Resume
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Upload index.html to Azure
        run: |
          az storage blob upload \
            --account-name resumerg9ec1 \
            --container-name '$web' \
            --file index.html \
            --name index.html \
            --overwrite true \
            --account-key ${{ secrets.STORAGE_KEY }}
